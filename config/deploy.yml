# Kamal template. Replace everything that says CAMBIAR.
#
#   bin/kamal setup      # first time
#   bin/kamal deploy     # subsequent deploys
#   bin/kamal app logs -f
#
# Host is read from DEPLOY_HOST in .env (gitignored) — see .env.example.
# bin/kamal loads .env before invoking kamal; running the `kamal` binary
# directly requires DEPLOY_HOST to already be exported in your shell.
#
# WARNING ABOUT WHERE TO HOST THIS
#
# This site reports on an earthquake in Valle del Cauca. Hosting it on a
# homelab inside the affected region turns it into a single point of failure
# correlated with the event itself: if power or internet go down from an
# aftershock, the site goes down exactly when it's needed most. For this
# project specifically, a VPS outside the region is the right call.
#
# A private network (Tailscale) is for administration, not for publishing: if
# people in Cali need to be able to open it, it has to be on the public internet.

service: ayuda-terremoto

image: rodarlibre/emergencia-colombia

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  # Stage 1: reachable over Tailscale only, so there is no public hostname and
  # no certificate to request. With no `host`, kamal-proxy accepts any Host
  # header, which is what an IP-based internal test needs.
  #
  # Stage 2, once the domain exists and a Cloudflare Tunnel points at port 80:
  #   ssl: false          <- Cloudflare terminates TLS, not kamal-proxy
  #   host: your.domain.co
  # Set ssl: true only if the server is directly reachable on 443.
  ssl: false
  # The Next.js standalone server listens on 3000; kamal-proxy would otherwise
  # health-check port 80 and time out while the container itself is healthy.
  app_port: 3000
  # Kamal uses this endpoint to decide whether to promote the new container.
  # /salud responds 503 if any test data sources are enabled, so a deploy
  # with fake data in the database FAILS instead of serving it.
  healthcheck:
    path: /salud
    interval: 5

registry:
  # DigitalOcean Container Registry. The dop_v1_* token goes in .kamal/secrets.
  server: registry.digitalocean.com
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Built on the server rather than locally. The server is x86_64 and the
  # development Mac is arm64, so a local build would run the whole Next.js
  # compile under QEMU emulation — slow, and prone to running out of memory.
  # The LXC builds it natively.
  remote: ssh://root@<%= ENV.fetch("DEPLOY_HOST") %>

env:
  clear:
    NODE_ENV: production
    OPERATING_ADMIN1_CODE: "76"
    DO_GRADIENT_BASE_URL: https://inference.do-ai.run/v1
    DO_GRADIENT_MODEL: openai-gpt-oss-20b
    # The rate limiter already exists, so this can be turned on. With "off"
    # the question box still works as plain-text search, which is a valid
    # way to go to production without spending on inference.
    AI_ENABLED: "on"

    # Operational limits. Commented out means "use the default compiled in";
    # see src/lib/config.ts. Uncomment, then `kamal env push` — that restarts
    # the container with the new value and does NOT rebuild the image, which
    # is the point: a limit can be raised while a spike is happening.
    # QUOTA_CLIENT_HOUR: "10"
    # QUOTA_CLIENT_DAY: "30"
    # QUOTA_NETWORK_HOUR: "60"
    # QUOTA_GLOBAL_MINUTE: "20"
    # FLOOD_NETWORK_PER_MINUTE: "120"
    # FLOOD_HIGH_LOAD_PER_MINUTE: "600"
  secret:
    - DATABASE_URL
    - DO_GRADIENT_API_KEY
    - INGEST_SECRET
    # Signs the limiter's anonymous cookie and the counter keys.
    # Required: without this there's no per-client limit, only network and global.
    - RATE_LIMIT_SECRET

# Postgres managed by Kamal as an accessory. If using a managed Postgres
# (Neon, Supabase, RDS), delete this section and point DATABASE_URL at it.
accessories:
  db:
    image: postgres:17-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: ayuda
        POSTGRES_DB: ayuda
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    files:
      - infra/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql

# Scheduled ingest. Kamal doesn't ship cron, so it's scheduled on the host
# and triggered over HTTP. One source per call.
#
#   */15 * * * * curl -fsS -X POST "https://DOMINIO/api/ingest?fuente=donde-ayudo-valle" -H "Authorization: Bearer $INGEST_SECRET" >/dev/null
#   */20 * * * * curl -fsS -X POST "https://DOMINIO/api/ingest?fuente=cali-ayuda"        -H "Authorization: Bearer $INGEST_SECRET" >/dev/null
#
# HTTP-free alternative, from the host itself:
#   docker exec $(docker ps -q -f label=service=ayuda-terremoto) node -e "..."
# but the HTTP route is simpler and works the same on any platform.
