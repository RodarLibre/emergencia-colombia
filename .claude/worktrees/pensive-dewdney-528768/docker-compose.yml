# Perfiles:
#   (ninguno)        solo la base de datos. Es el uso normal con `pnpm dev`.
#   --profile tools  agrega Adminer para inspeccionar la base en el navegador.
#   --profile app    corre la app web en contenedor (prueba del build de prod).
#   --profile cache  agrega Valkey. Ver nota en el servicio: hoy NO se usa.
#
#   docker compose up -d                        # solo db
#   docker compose --profile tools up -d         # db + adminer
#   docker compose --profile app up -d --build   # db + web

services:
  db:
    # Postgres estandar, no PostGIS: la v1 filtra por municipio, no por radio.
    # La imagen oficial trae pg_trgm y unaccent, que es todo lo que se usa, y
    # es nativa en arm64 (la de PostGIS corre emulada en Apple Silicon).
    # Cuando se agregue busqueda por distancia: cambiar a postgis/postgis o a
    # un Postgres administrado con PostGIS. Es una linea.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayuda
      POSTGRES_PASSWORD: ayuda_local
      POSTGRES_DB: ayuda
    ports:
      # 5439: los puertos 5432-5437 suelen estar tomados por otros proyectos.
      - "5439:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayuda -d ayuda"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Dentro de la red de compose el puerto es el interno, 5432.
      DATABASE_URL: postgres://ayuda:ayuda_local@db:5432/ayuda
      NODE_ENV: production
      AI_ENABLED: ${AI_ENABLED:-off}
      DO_INFERENCE_BASE_URL: ${DO_INFERENCE_BASE_URL:-https://inference.do-ai.run/v1}
      DO_INFERENCE_API_KEY: ${DO_INFERENCE_API_KEY:-}
      AI_MODEL_INTENT: ${AI_MODEL_INTENT:-openai-gpt-oss-20b}
    depends_on:
      db:
        condition: service_healthy

  # NO SE USA TODAVIA, a proposito.
  #
  # El limitador de uso del MVP vive en Postgres: una dependencia menos y a
  # esta escala alcanza. Valkey se justifica cuando se cumpla alguna de estas:
  #   - la app corre en varias instancias sin estado (por ejemplo Vercel) y el
  #     conteo por Postgres empieza a pesar en latencia p95, o
  #   - hace falta cachear respuestas de busqueda con TTL corto.
  # Si se enciende: solo contadores efimeros. Nunca preguntas, nombres,
  # telefonos ni registros del catalogo (plan 5.8).
  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["cache"]
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
